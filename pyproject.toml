[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vgf-adapter-model-explorer"
version = "0.5.1"
description = "Adapter for Model Explorer to support VGF files"
readme = "README.md"
requires-python = ">=3.10, <3.13"
keywords = ["model-explorer", "vgf", "visualization"]
license = "Apache-2.0"
license-files = ["LICENSE"]

classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Operating System :: POSIX",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: MacOS",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]

dependencies = [
  "ai-edge-model-explorer>=0.1.26,<0.2.0",
  "spirv-adapter-model-explorer == 0.2.0",
  "ai-ml-sdk-vgf-library == 0.11.0",
]

[project.urls]
Repository = "https://github.com/arm/vgf-adapter-model-explorer"
Changelog = "https://github.com/arm/vgf-adapter-model-explorer/releases"

[dependency-groups]
dev = [
    "pytest==9.0.1",
    "pytest-timeout==2.4.0",
    "ruff==0.14.2",
    "pyright==1.1.407",
    "ai-edge-model-explorer==0.1.32",
]
build = [
    "build==1.3.0",
]
coverage = [
    "pytest-cov==7.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/vgf_adapter_model_explorer"]

[tool.hatch.envs.default]
dependencies = [
    "ai-edge-model-explorer==0.1.32",
    "build==1.3.0",
    "pyright==1.1.407",
    "pytest==9.0.1",
    "pytest-cov==7.0.0",
    "pytest-timeout==2.4.0",
    "ruff==0.14.2",
]

[tool.hatch.envs.default.scripts]
lint = "ruff check --output-format=github"
format-check = "ruff format --check"
type-check = "pyright"
test = "pytest --tb=short {args}"

[tool.hatch.envs.ci]
dev-mode = false
dependencies = [
    "ai-edge-model-explorer==0.1.32",
    "build==1.3.0",
    "pyright==1.1.407",
    "pytest==9.0.1",
    "pytest-cov==7.0.0",
    "pytest-timeout==2.4.0",
    "ruff==0.14.2",
]

[tool.hatch.envs.ci.scripts]
lint = "ruff check --output-format=github"
format-check = "ruff format --check"
type-check = "pyright"
test = "pytest --tb=short {args}"

[tool.pyright]
include = [
  "src",
]
exclude = [
  "src/vgf_adapter_model_explorer/tests",
]
typeCheckingMode = "standard"

[tool.pytest.ini_options]
pythonpath = "src"
testpaths = ["src/vgf_adapter_model_explorer/tests"]

[tool.ruff]
line-length = 79
target-version = "py310"

[tool.ruff.lint]
# https://docs.astral.sh/ruff/rules/
select = [
    "F", #Pyflakes
    "B", #Bugbear
    "I", #Isort
    "SIM", #Simplify
    "C4", #Comprehensions
]
