config_version = "0"

exclude_patterns = [
  "**/.yarn/**",
  "**/*.d.ts",
  "**/assets/**",
  "**/bower_components/**",
  "**/build/**",
  "**/cache/**",
  "**/config/**",
  "**/db/**",
  "**/deps/**",
  "**/dist/**",
  "**/extern/**",
  "**/external/**",
  "**/generated/**",
  "**/Godeps/**",
  "**/gradlew/**",
  "**/mvnw/**",
  "**/node_modules/**",
  "**/protos/**",
  "**/seed/**",
  "**/target/**",
  "**/templates/**",
  "**/testdata/**",
  "**/vendor/**",
  "**/executorch_flatbuffer/**",
]

test_patterns = [
  "**/test/**",
  "**/spec/**",
  "**/*.test.*",
  "**/*.spec.*",
  "**/*_test.*",
  "**/*_spec.*",
  "**/test_*.*",
  "**/spec_*.*",
]

[smells]
mode = "comment"

[[plugin]]
name = "gitleaks"
mode = "block"

[[plugin]]
name = "bandit"
mode = "comment"

[[plugin]]
name = "osv-scanner"
mode = "monitor"

[[plugin]]
name = "actionlint"
mode = "comment"

[[plugin]]
name = "zizmor"
mode = "comment"

[[exclude]]
file_patterns = ["**/tests/**"]
plugins = ["bandit"]

[[source]]
name = "default"
default = true
