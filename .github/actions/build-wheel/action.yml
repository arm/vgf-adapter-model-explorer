name: Build wheel (composite)
description: Builds wheels for VGF Adapter for Model Explorer

inputs:
  python-version:
    required: true
  artifact-name:
    required: false
    default: dist
  build-sdist:
    required: false
    default: "false"

runs:
  using: "composite"
  steps:
    - name: Set up Python environment
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
      with:
        python-version: ${{ inputs.python-version }}

    - uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081 # v5
      with:
        enable-cache: false

    - name: Build plugin package
      shell: bash
      env:
        BUILD_PYTHON_VERSION: ${{ inputs.python-version }}
      run: uv build --python "$BUILD_PYTHON_VERSION" --wheel

    - name: Build source distribution
      if: inputs.build-sdist == 'true' && runner.os == 'Linux' && runner.arch == 'X64'
      shell: bash
      env:
        BUILD_PYTHON_VERSION: ${{ inputs.python-version }}
      run: uv build --python "$BUILD_PYTHON_VERSION" --sdist

    - name: Upload plugin package artifact
      uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
      with:
        name: ${{ inputs.artifact-name }}
        path: dist