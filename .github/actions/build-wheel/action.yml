name: Build wheel (composite)
description: Builds wheels for VGF Adapter for Model Explorer

inputs:
  python-version:
    required: true
  internal-dev-version:
    required: false
    default: "false"
  artifact-name:
    required: false
    default: dist
  build-sdist:
    required: false
    default: "false"

runs:
  using: "composite"
  steps:
    - name: Set up Python environment
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
      with:
        python-version: ${{ inputs.python-version }}

    - name: Ensure pip is available
      shell: bash
      run: |
        python -m ensurepip --upgrade || {
          curl -sS https://bootstrap.pypa.io/get-pip.py -o "$RUNNER_TEMP/get-pip.py"
          python "$RUNNER_TEMP/get-pip.py"
        }
        python -m pip install --upgrade pip

    - name: Set internal development version
      if: inputs.internal-dev-version == 'true'
      shell: bash
      run: |
        BASE_VERSION=$(sed -n 's/^version = "\(.*\)"$/\1/p' pyproject.toml | head -n 1)
        SHORT_SHA="${GITHUB_SHA::7}"
        DEV_VERSION="${BASE_VERSION}.dev${GITHUB_RUN_NUMBER}+${SHORT_SHA}"
        echo "Building internal development version ${DEV_VERSION} from ${GITHUB_SHA}"
        sed -i "s/^version = \".*\"$/version = \"${DEV_VERSION}\"/" pyproject.toml

    - name: Build plugin package
      shell: bash
      run: |
        python -m pip install build
        python -m build --wheel

    - name: Build source distribution
      if: inputs.build-sdist == 'true' && runner.os == 'Linux' && runner.arch == 'X64'
      shell: bash
      run: |
        python -m build --sdist

    - name: Upload plugin package artifact
      uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
      with:
        name: ${{ inputs.artifact-name }}
        path: dist