name: VGF Adapter for Model Explorer CI

on:
  push:
    branches: ["main"]
    tags:
      - "v*.*.*"
  pull_request:
    branches: ["main"]
  workflow_dispatch:
  schedule:
    - cron: "0 3 */6 * *"

env:
  DEFAULT_PY_VERSION: "3.10"
  ME_REPO_ACCESS_APP_ID: ${{ secrets.ME_REPO_ACCESS_APP_ID }}
  ME_REPO_ACCESS_PRIVATE_KEY: ${{ secrets.ME_REPO_ACCESS_PRIVATE_KEY }}

permissions:
  contents: read

jobs:
  tests:
    name: Run tests
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
        runner: ${{ fromJSON(vars.TEST_RUNNERS) }}
    runs-on: ${{ matrix.runner }}
    env:
      HATCH_DATA_DIR: ${{ github.workspace }}/.hatch-data-py${{ matrix.python-version }}
      HATCH_CACHE_DIR: ${{ github.workspace }}/.hatch-cache-py${{ matrix.python-version }}
    steps:
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Checkout plugin repo
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Install Hatch
        env:
          PIP_INDEX_URL: ${{ secrets.INTERNAL_PYPI_AUTH_INDEX_URL || 'https://pypi.org/simple' }}
        run: |
          python -m pip install hatch==1.14.1 virtualenv==20.26.6

      - name: Lint and Format Check
        run: |
          hatch run ci:lint
          hatch run ci:format-check

      - name: Type Check
        run: |
          hatch run ci:type-check

      - name: Run Tests
        shell: bash
        env:
          PIP_INDEX_URL: ${{ secrets.INTERNAL_PYPI_AUTH_INDEX_URL || 'https://pypi.org/simple' }}
          MATRIX_RUNNER: ${{ matrix.runner }}
          LINUX_RUNNER: ${{ vars.LINUX_RUNNER }}
          MATRIX_PYTHON_VERSION: ${{ matrix.python-version }}
          DEFAULT_PY_VERSION: ${{ env.DEFAULT_PY_VERSION }}
        run: |
          PYTEST_CVG_FLAGS=""
          if [[ "$MATRIX_RUNNER" == "$LINUX_RUNNER" && \
              "$MATRIX_PYTHON_VERSION" == "$DEFAULT_PY_VERSION" ]]; then
            PYTEST_CVG_FLAGS="-v --cov=vgf_adapter_model_explorer --cov-report=lcov:reports/lcov.info"
          fi
          hatch run ci:test -- ${PYTEST_CVG_FLAGS}

      - name: Upload coverage to Qlty
        if: matrix.runner == vars.LINUX_RUNNER && matrix.python-version == env.DEFAULT_PY_VERSION
        uses: qltysh/qlty-action/coverage@9e8e09dfc3d82a968f4034f5265eaf3c142881f7 # v2.0.0
        with:
          token: ${{ secrets.QLTY_COVERAGE_TOKEN }}
          files: reports/lcov.info

  build:
    name: Build Package
    needs: [tests]
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
        runner: ${{ fromJSON(vars.TEST_RUNNERS) }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: ./.github/actions/build-wheel
        env:
          PIP_INDEX_URL: ${{ secrets.INTERNAL_PYPI_AUTH_INDEX_URL || 'https://pypi.org/simple' }}
        with:
          python-version: ${{ matrix.python-version }}
          internal-dev-version: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository_owner != 'arm' }}
          artifact-name: dist-${{ runner.os }}-${{ runner.arch }}-py${{ matrix.python-version }}
          build-sdist: ${{ runner.os == 'Linux' && runner.arch == 'X64' && matrix.python-version == env.DEFAULT_PY_VERSION }}

      - name: Create wheel SBOM output directory
        if: runner.os == 'Linux' && runner.arch == 'X64' && matrix.python-version == env.DEFAULT_PY_VERSION
        run: mkdir -p sbom

      - name: Generate wheel SBOM
        if: runner.os == 'Linux' && runner.arch == 'X64' && matrix.python-version == env.DEFAULT_PY_VERSION
        env:
          PIP_INDEX_URL: ${{ secrets.INTERNAL_PYPI_AUTH_INDEX_URL || 'https://pypi.org/simple' }}
        run: |
          python -m pip install --index-url https://pypi.org/simple cyclonedx-bom==7.3.0
          python -m venv .sbom-venv
          .sbom-venv/bin/python -m pip install --upgrade pip
          .sbom-venv/bin/python -m pip install dist/*.whl
          python -m cyclonedx_py environment .sbom-venv/bin/python \
            --output-format JSON \
            --output-file sbom/vgf-adapter-model-explorer-wheel.cdx.json

      - name: Add SBOM disclaimer
        if: runner.os == 'Linux' && runner.arch == 'X64' && matrix.python-version == env.DEFAULT_PY_VERSION
        run: |
          python scripts/add-sbom-disclaimer.py \
            sbom/vgf-adapter-model-explorer-wheel.cdx.json

      - name: Download adapter SBOMs
        if: runner.os == 'Linux' && runner.arch == 'X64' && matrix.python-version == env.DEFAULT_PY_VERSION
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/download-adapter-sboms.py \
            --github-token "$GITHUB_TOKEN"

      - name: Upload wheel SBOM artifact
        if: runner.os == 'Linux' && runner.arch == 'X64' && matrix.python-version == env.DEFAULT_PY_VERSION
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: project-sbom
          path: |
            sbom/**/*.json
            sbom/dependencies/adapter-sbom-manifest.json
          if-no-files-found: error

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/') && github.repository_owner == 'arm'
    needs:
      - build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/vgf-adapter-model-explorer
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: getsentry/action-github-app-token@d4b5da6c5e37703f8c3b3e43abb5705b46e159cc #v3.0.0
        id: get_app_token
        with:
          app_id: ${{ env.ME_REPO_ACCESS_APP_ID }}
          private_key: ${{ env.ME_REPO_ACCESS_PRIVATE_KEY }}

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          token: ${{ steps.get_app_token.outputs.token }}
          persist-credentials: false

      - name: Generate release notes
        uses: orhun/git-cliff-action@d77b37db2e3f7398432d34b72a12aa3e2ba87e51 # v4.6.0
        id: git-cliff
        with:
          config: cliff.toml
          args: --latest
        env:
          OUTPUT: CHANGELOG.md
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPO: ${{ github.repository }}

      - name: Download distribution artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: dist-*
          path: dist/
          merge-multiple: true

      - name: Publish distribution to PyPI
        uses: pypa/gh-action-pypi-publish@76f52bc884231f62b9a034ebfe128415bbaabdfc # release/v1.12.4

      - name: Download project SBOM
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: project-sbom
          path: sbom/

      - name: Publish GitHub release
        uses: softprops/action-gh-release@5be0e66d93ac7ed76da52eca8bb058f665c3a5fe # v2.4.2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body_path: CHANGELOG.md
          files: |
            dist/*.whl
            dist/*.tar.gz
            sbom/**/*.json
          token: ${{ steps.get_app_token.outputs.token }}

  release-internal:
    name: Release to internal PyPI
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')) && github.repository_owner != 'arm'
    needs:
      - build
    runs-on: ${{ vars.LINUX_RUNNER }}
    permissions: {}

    steps:
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ env.DEFAULT_PY_VERSION }}

      - name: Download distribution artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: dist-*
          path: dist/
          merge-multiple: true

      - name: Publish distribution to internal PyPI
        uses: pypa/gh-action-pypi-publish@76f52bc884231f62b9a034ebfe128415bbaabdfc # release/v1.12.4
        with:
          repository-url: ${{ vars.INTERNAL_PYPI_UPLOAD_URL }}
          user: ${{ secrets.INTERNAL_PYPI_USERNAME }}
          password: ${{ secrets.INTERNAL_PYPI_TOKEN }}
          packages-dir: dist/
          attestations: false

  sync-commits-to-public-repo:
    name: Sync commits to public repo
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository_owner != 'arm'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Checkout target repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: arm/vgf-adapter-model-explorer
          token: ${{ secrets.ARM_ORG_TOKEN }}
          path: target-repo
          persist-credentials: true
      - name: Push commits to public repo
        env:
          SOURCE_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          cd target-repo
          git remote add source "$SOURCE_URL"
          git fetch source main
          git checkout main
          git merge source/main
          git push origin main

  sync-release-tags-to-public-repo:
    name: Sync release tags to public repo
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') && github.repository_owner != 'arm'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Checkout target repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: arm/vgf-adapter-model-explorer
          token: ${{ secrets.ARM_ORG_TOKEN }}
          path: target-repo
          persist-credentials: true
      - name: Push tags to public repo
        env:
          REF_NAME: ${{ github.ref_name }}
          SOURCE_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          cd target-repo
          git remote add source "$SOURCE_URL"
          git fetch source --tags
          git push origin "refs/tags/$REF_NAME"
