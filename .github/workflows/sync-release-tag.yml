name: Sync release tag to public repo

on:
  workflow_dispatch:
    inputs:
      release-tag:
        description: "Internal tag to publish publicly (triggers public CI and PyPI), e.g. v0.5.1"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: sync-release-tag-${{ inputs.release-tag }}
  cancel-in-progress: false

jobs:
  sync:
    name: Sync selected release tag
    if: github.repository == 'Arm-Debug/vgf-adapter-model-explorer'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout internal repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Validate selected tag
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.release-tag }}
        run: |
          if [[ "$RELEASE_TAG" != v*.*.* ]] || ! git check-ref-format "refs/tags/$RELEASE_TAG"; then
            echo "Expected a release tag such as v0.5.1." >&2
            exit 1
          fi
          git rev-parse --verify "refs/tags/${RELEASE_TAG}^{commit}"

      - name: Checkout public repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: arm/vgf-adapter-model-explorer
          token: ${{ secrets.ARM_ORG_TOKEN }}
          path: target-repo
          persist-credentials: true

      - name: Push selected tag to public repo
        working-directory: target-repo
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.release-tag }}
          SOURCE_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          git remote add source "$SOURCE_URL"
          git fetch --no-tags source "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          git -c push.followTags=false push origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
