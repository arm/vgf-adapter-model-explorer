name: Internal PR Checks

on:
  pull_request:
    types: [opened, reopened, synchronize, edited, ready_for_review, labeled, unlabeled]

permissions:
  pull-requests: write
  issues: write
  contents: read

jobs:
  checks:
    if: ${{ github.event.repository.private }}
    uses: Arm-Debug/github-workflow-wizardry/.github/workflows/internal-checks.yml@b1fec023c429c1027d936170f696a6ee6711ce6e
    with:
      internal_scan: true
      internal_review: true
    secrets:
      VAULT_URL: ${{ secrets.VAULT_URL }}
      VAULT_ROLE_ID: ${{ secrets.VAULT_ROLE_ID }}
      VAULT_SECRET_ID: ${{ secrets.VAULT_SECRET_ID }}
